# Tool versions are pinned in uv.lock; these hooks just run them through uv.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly
        entry: uv run --locked pyrefly check
        language: system
        types: [python]
        pass_filenames: false
